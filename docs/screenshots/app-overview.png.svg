<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" fill="none">
  <rect width="900" height="520" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <!-- Top bar -->
  <rect x="0" y="0" width="900" height="70" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="36" y="22" width="28" height="28" rx="6" fill="#EFF6FF" stroke="#BFDBFE"/>
  <path d="M44 30h12v12H44z" fill="#2563EB"/>
  <text x="76" y="38" font-family="sans-serif" font-weight="700" font-size="16" fill="#0F172A">Notes Dashboard</text>
  <text x="76" y="52" font-family="sans-serif" font-size="11" fill="#64748B">3 notes stored · SQLite Persistent</text>
  
  <rect x="750" y="19" width="114" height="34" rx="6" fill="#2563EB"/>
  <text x="785" y="41" font-family="sans-serif" font-weight="600" font-size="13" fill="#FFFFFF">+ New Note</text>
  
  <!-- Search bar -->
  <rect x="36" y="94" width="700" height="42" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="56" y="120" font-family="sans-serif" font-size="13" fill="#94A3B8">🔍 Search 3 notes by title or content... (press / to focus)</text>
  
  <!-- Grid Cards -->
  <!-- Card 1 -->
  <rect x="36" y="160" width="260" height="220" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="56" y="195" font-family="sans-serif" font-weight="700" font-size="15" fill="#0F172A">Welcome to Notes App</text>
  <text x="56" y="225" font-family="sans-serif" font-size="12" fill="#475569" width="220">Full-stack notes dashboard with real-</text>
  <text x="56" y="243" font-family="sans-serif" font-size="12" fill="#475569">time debounced search, responsive</text>
  <text x="56" y="261" font-family="sans-serif" font-size="12" fill="#475569">cards, and SQLite CRUD persistence.</text>
  <line x1="56" y1="330" x2="276" y2="330" stroke="#F1F5F9"/>
  <text x="56" y="355" font-family="sans-serif" font-size="11" fill="#94A3B8">Updated 5m ago</text>

  <!-- Card 2 -->
  <rect x="320" y="160" width="260" height="220" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="340" y="195" font-family="sans-serif" font-weight="700" font-size="15" fill="#0F172A">Keyboard Shortcuts &amp; Tips</text>
  <text x="340" y="225" font-family="sans-serif" font-size="12" fill="#475569">Press "/" to focus the search bar.</text>
  <text x="340" y="243" font-family="sans-serif" font-size="12" fill="#475569">Use Ctrl+Enter to save immediately.</text>
  <text x="340" y="261" font-family="sans-serif" font-size="12" fill="#475569">Hit Esc to dismiss modals quickly.</text>
  <line x1="340" y1="330" x2="560" y2="330" stroke="#F1F5F9"/>
  <text x="340" y="355" font-family="sans-serif" font-size="11" fill="#94A3B8">Updated 1h ago</text>

  <!-- Card 3 -->
  <rect x="604" y="160" width="260" height="220" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="624" y="195" font-family="sans-serif" font-weight="700" font-size="15" fill="#0F172A">Architecture &amp; Features</text>
  <text x="624" y="225" font-family="sans-serif" font-size="12" fill="#475569">Clean monorepo structure with Express</text>
  <text x="624" y="243" font-family="sans-serif" font-size="12" fill="#475569">backend, parameterized SQLite queries,</text>
  <text x="624" y="261" font-family="sans-serif" font-size="12" fill="#475569">and toast notification alert pipeline.</text>
  <line x1="624" y1="330" x2="844" y2="330" stroke="#F1F5F9"/>
  <text x="624" y="355" font-family="sans-serif" font-size="11" fill="#94A3B8">Updated 2d ago</text>
  
  <!-- Footer status -->
  <rect x="36" y="420" width="828" height="60" rx="8" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="60" y="455" font-family="sans-serif" font-size="12" fill="#475569">● Backend connected at http://localhost:3000/api/notes · Dual SQLite Engine (better-sqlite3 &amp; WASM)</text>
</svg>
